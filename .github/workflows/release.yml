# Builds Parliament's single binary — noctua with Tyto's release build
# compiled in (`embed-frontend`) — for macOS and Linux.
#
# Pushing a tag `v*` creates a DRAFT release and attaches each build to
# it; publishing the release stays a person's decision. Run by hand
# (Actions → Release → Run workflow), it builds every target as a dry
# run and publishes nothing.
#
# Asset names carry no version, so
# https://github.com/parliament-labs/parliament/releases/latest/download/parliament-<target>.tar.gz
# always names the newest release's build.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  TRUNK_VERSION: 0.21.14

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Parliament $GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    # Runs on a dry run too, where `draft` is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Built on 22.04: needs glibc 2.35+ and OpenSSL 3 (libssl.so.3) —
          # current Debian, Ubuntu, Fedora, RHEL 9; not RHEL 7 / 8.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Trunk
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)   host=aarch64-apple-darwin ;;
            Darwin-x86_64)  host=x86_64-apple-darwin ;;
            Linux-x86_64)   host=x86_64-unknown-linux-gnu ;;
            Linux-aarch64)  host=aarch64-unknown-linux-gnu ;;
            *) echo "no Trunk build for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          base="https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-$host.tar.gz"
          curl -fsSL -o trunk.tar.gz "$base"
          echo "$(curl -fsSL "$base.sha256" | awk '{print $1}')  trunk.tar.gz" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf trunk.tar.gz -C "$HOME/.local/bin" && rm trunk.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Frontend
        run: trunk build --release

      - name: Backend, with the frontend built in
        run: cargo build --release --locked -p noctua --features embed-frontend --target ${{ matrix.target }}

      - name: Package
        run: |
          name="parliament-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/noctua" LICENSE NOTICE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -l "$name.tar.gz"

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            "parliament-${{ matrix.target }}.tar.gz" "parliament-${{ matrix.target }}.tar.gz.sha256"
