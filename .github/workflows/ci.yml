# Every push to main and every pull request: the unit tests, and clippy
# with warnings as errors — native on Linux and macOS, and the frontend
# for wasm.
#
# The toolchain is pinned so a new Rust release's new lints can't turn
# CI red on their own; bump it on purpose, fixing what the new clippy
# finds. The release workflow builds with stable.
#
# Not here: the `#[ignore]`d live tests and the Playwright specs, which
# need Pagila / Sakila and the real psql and mysql CLIs to compare with.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04 }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy, frontend for wasm
        if: runner.os == 'Linux'
        run: cargo clippy -p tyto --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
